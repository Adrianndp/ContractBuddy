server {
    listen 80;
    root /usr/share/nginx/html;
    index _shell.html; # the SPA entry (there's no index.html)

    # SPA: unknown paths fall back to the shell, the client-side router takes it from there.
    location / {
        try_files $uri /_shell.html;
    }

    # Hashed filenames → cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
